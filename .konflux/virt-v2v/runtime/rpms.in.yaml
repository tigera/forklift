packages:
  - virt-v2v
  - virtio-win
  - catatonit
  - libvirt-libs
  # Unversioned so refresh-rpm-lockfiles can advance the appliance kernel to the
  # current z-stream. Pinning an exact NEVRA here froze it permanently and was the
  # single largest source of CVE findings in the v2.12.7 scan.
  - kernel
  - kernel-modules-core
  - kernel-core
  - kernel-modules
contentOrigin:
  repofiles:
    - ./redhat.repo
context:
  containerfile:
    file: ../../../build/virt-v2v/Containerfile-downstream
    stageName: runtime
arches: [x86_64]
