# Publishes dev images and install manifests for each commit merged to main or
# a release-calient-* branch: every image a release ships, each checked against the commit
# it was built from, and the install manifests that name them. On merge, not on
# PRs, because the full build is expensive, and so the push credential only
# ever meets merged code.
version: condensed
generateName: forklift-publish-images-

# Catches a hang outside any step's own timeout.
timeout: 4h

globalPrologue: |
  # The checkout can belong to a different user than the step runs as, and git
  # refuses to read such a repository unless told it is safe.
  git config --global --add safe.directory '*'

defaults:
  timeout: 30m
  env:
    # Where the images are pushed, and so what the manifests name.
    - name: REGISTRY
      value: quay.io
    - name: REGISTRY_ORG
      value: tigeradev

steps:
  # One step, because the images live in its docker daemon until they're pushed.
  # The virt-v2v and deep-inspection images are amd64-only, as is the build.
  - name: images
    # Only merges to main or a release-calient-* branch publish.
    when: GIT_REF_TYPE == 'MERGE' && (GIT_BRANCH == 'main' || GIT_BRANCH =~ '^release-calient-')
    jobSize: large
    requests: {cpu: 7000m, memory: 12Gi}
    timeout: 3h
    services:
      - docker
    # The push credential, in this step only.
    secretBundles:
      - name: quay-tigeradev-hashrelease
        keys:
          - name: QUAY_USER
          - name: QUAY_TOKEN
    # Steps stop at the first command that fails, so nothing unchecked is ever
    # pushed. The build and checks are started without QUAY_USER or QUAY_TOKEN
    # in their environment, and the login comes after them.
    commands: |
      env -u QUAY_USER -u QUAY_TOKEN .argoci/scripts/publish/build-images.sh
      env -u QUAY_USER -u QUAY_TOKEN .argoci/scripts/publish/check-images.sh
      echo "$QUAY_TOKEN" | docker login --username "$QUAY_USER" --password-stdin quay.io
      .argoci/scripts/publish/push-images.sh

  # After the images, so manifests are only published for images that were
  # pushed. The gcr artifact is what consumers fetch, so a failed push fails
  # the run; the job artifact below is only for reading a run's output.
  - name: manifests
    depends: [images]
    when: GIT_REF_TYPE == 'MERGE' && (GIT_BRANCH == 'main' || GIT_BRANCH =~ '^release-calient-')
    useGoBuild: true
    requests: {cpu: 500m, memory: 1Gi}
    env:
      - name: MANIFESTS_REPO
        value: gcr.io/unique-caldron-775/cnx/tigera/forklift-manifests
    # The push credential for the manifests' registry, read only by the login,
    # which writes it to a file the push deletes.
    # An env var, not a file under /root: go-build may run the step as a
    # non-root user.
    secretBundles:
      - name: google-service-account-for-gcr
        keys:
          - name: google-service-account-for-gcr-key.json
            as: GCR_KEY
    commands: |
      env -u GCR_KEY .argoci/scripts/publish/render-manifests.sh
      env -u GCR_KEY .argoci/scripts/publish/install-oras.sh
      printenv GCR_KEY | _output/publish/bin/oras login --registry-config /tmp/forklift-registry-auth.json --username _json_key --password-stdin gcr.io
      env -u GCR_KEY .argoci/scripts/publish/push-manifests.sh
    epilogue: |
      # Epilogues don't inherit the commands' `cd` or exports.
      unset GCR_KEY
      cd "${CI_HOME}/${CI_GIT_DIR}"
      # Only if the push script never ran; it deletes the login itself.
      rm -f /tmp/forklift-registry-auth.json
      artifact push job _output/publish/manifests --destination manifests || true
